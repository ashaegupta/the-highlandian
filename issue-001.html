  <style>
    :root {
      --ink: #292929;
      --ink-soft: #555353;
      --gold: #da9d32;
      --magpie: #1a7fc1;
      --paper: #ffffff;
      --rule: #292929;
      --gutter: 16px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: #f3f1ec;
      color: var(--ink);
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.5;
    }
    img { display: block; max-width: 100%; height: auto; }
    a { color: var(--ink); }

    .top {
      background: var(--paper);
      border-bottom: 3px double var(--rule);
    }
    .top-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 20px var(--gutter) 14px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .top a.home { display: block; flex: 0 1 300px; min-width: 0; }
    .top a.home img { width: 100%; }
    .meta {
      flex: 1 1 auto;
      text-align: right;
      font-family: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
    }
    .meta a { color: var(--magpie); text-decoration: none; margin-left: 14px; }
    .meta a:hover { color: var(--ink); }

    .pages {
      max-width: 880px;
      margin: 0 auto;
      padding: 20px var(--gutter) 40px;
    }
    .pages figure { margin: 0 0 16px; }
    .pages img {
      width: 100%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 20px rgba(0,0,0,.08);
    }
    .pages figcaption {
      font-family: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-align: right;
      margin-top: 6px;
    }

    .end {
      max-width: 880px;
      margin: 0 auto;
      padding: 8px var(--gutter) 56px;
      text-align: center;
    }
    .button {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-family: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 20px;
      margin: 0 6px 10px;
    }
    .button:hover { background: var(--gold); color: var(--ink); }
    .end p { color: var(--ink-soft); font-size: 14px; margin: 10px 0 0; }
    .end .bunny { width: 96px; margin: 24px auto 0; }

    @media (max-width: 640px) {
      .top-inner { padding: 16px var(--gutter) 12px; }
      .top a.home { flex-basis: 170px; }
      .meta { font-size: 12px; }
      .meta span { display: none; }
      .pages { padding: 12px 8px 24px; }
      .pages figure { margin-bottom: 12px; }
    }
